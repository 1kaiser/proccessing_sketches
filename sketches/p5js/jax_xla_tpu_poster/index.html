<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAX / XLA / TPU — Procedural p5.js Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="sketch.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f1f5f9;
      color: #0f172a;
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    canvas {
      max-width: min(92vw, 720px);
      height: auto !important;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
      background: #ffffff;
    }
    .bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      padding: 10px 18px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="poster-mount"></div>
  <div class="bar">
    <button onclick="window._posterP5 && window._posterP5.saveCanvas('jax_xla_tpu_poster', 'png')">
      Download 2400×3200 PNG
    </button>
  </div>
  <script>
    window._posterP5 = new p5(
      (p) => window.JaxXlaTpuPoster.createSketch(p, { width: 2400, height: 3200, seed: 2026 }),
      document.getElementById("poster-mount")
    );
  </script>
</body>
</html>
